<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset DraftP Password</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">ISOLATED DEVELOPMENT PROTOTYPE</p>
    <h1>Reset password</h1>
    <p class="subhead">Choose a new password for your DraftP account.</p>
    <p id="status" role="status" aria-live="polite"></p>

    <form id="resetForm" class="hidden">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password"
        minlength="8" maxlength="128" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password"
        minlength="8" maxlength="128" required>
      <button type="submit">Update password</button>
    </form>

    <p><a href="/">Return to sign in</a></p>
    <p class="footnote">Development project only. Never share your recovery link.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="reset-password.mjs"></script>
</body>
</html>
